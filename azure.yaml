# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: functions-e2e-sb-vnet
metadata:
    template: functions-e2e-sb-vnet@0.0.1
infra:
  provider: bicep
  path: infra
services:
  processor:
    project: ./src/
    language: python
    host: function
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: .\infra\scripts\postprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: chmod +x ./infra/scripts/*.sh && ./infra/scripts/postprovision.sh
      interactive: true
      continueOnError: false
